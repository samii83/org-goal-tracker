version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goaltrack_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - SECRET_KEY=change_this_to_a_secure_random_key_in_production
      # By default, uses SQLite with the persistent volume below:
      - DATABASE_URL=sqlite:////app/data/goaltrack.db
      # To use MySQL instead, set DATABASE_URL=mysql+pymysql://root:password@mysql:3306/org_goal_tracker
    volumes:
      # Persistent storage directory for SQLite database
      - ./data:/app/data
    restart: unless-stopped

  # Optional MySQL container (uncomment if testing against MySQL container):
  # mysql:
  #   image: mysql:8.0
  #   container_name: goaltrack_mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: rootpassword
  #     MYSQL_DATABASE: org_goal_tracker
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #
  # volumes:
  #   mysql_data:

